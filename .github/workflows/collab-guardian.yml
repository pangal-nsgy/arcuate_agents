name: Collaboration Guardian

# Triggers on push to dev branch — reviews code, then auto-merges to deploy if approved
on:
  push:
    branches:
      - dev

permissions:
  contents: write

env:
  DEPLOY_BRANCH: claude/mcp-chrome-extension-BW3zj

jobs:
  review-and-merge:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml httpx

      # ── Gather metadata ──────────────────────────────────────
      - name: Get push metadata
        id: meta
        run: |
          echo "author=${{ github.actor }}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          FILE_COUNT=$(echo "$CHANGED" | grep -c '.' || echo "0")
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      # ── Notify Discord: push received ────────────────────────
      - name: Discord — push received
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          python3 << 'PYEOF'
          import httpx, os
          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          files = os.environ.get("CHANGED", "").strip().split("\n")
          file_list = "\n".join(f"- `{f}`" for f in files[:15] if f)
          if len(files) > 15:
              file_list += f"\n... and {len(files) - 15} more"
          embed = {
              "title": "Push to dev — reviewing...",
              "description": f"**${{ steps.meta.outputs.author }}** pushed `${{ steps.meta.outputs.sha_short }}` — ${{ steps.meta.outputs.commit_msg }}\n\nOpus 4.6 is reviewing this before merging to deploy.",
              "color": 0x3498DB,
              "fields": [{"name": f"Files Changed ({os.environ.get('FILE_COUNT', '?')})", "value": file_list[:1024] or "none"}],
          }
          resp = httpx.post(webhook, json={"embeds": [embed]})
          print(f"Discord: {resp.status_code}")
          PYEOF
        env:
          CHANGED: ${{ steps.meta.outputs.changed_files }}
          FILE_COUNT: ${{ steps.meta.outputs.file_count }}

      # ── Step 1: Consistency linter ───────────────────────────
      - name: Run consistency linter
        id: lint
        run: python3 scripts/lint_consistency.py --verbose

      # ── Step 2: AI code review (Opus 4.6) ────────────────────
      - name: AI code review
        id: review
        run: python3 scripts/ai_review.py

      # ── Step 3: Auto-merge to deploy branch ──────────────────
      - name: Merge dev → deploy
        if: steps.lint.outcome == 'success' && steps.review.outcome == 'success'
        id: merge
        run: |
          git config user.name "Collaboration Guardian"
          git config user.email "guardian@arcuatehealth.com"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git merge origin/dev --no-edit -m "guardian: merge dev (${{ steps.meta.outputs.sha_short }}) — AI approved"
          git push origin "$DEPLOY_BRANCH"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # ── Discord: final status ────────────────────────────────
      - name: Discord — result
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          python3 << 'PYEOF'
          import httpx, os
          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          lint_ok = os.environ.get("LINT_OUTCOME") == "success"
          review_ok = os.environ.get("REVIEW_OUTCOME") == "success"
          merged = os.environ.get("MERGED") == "true"
          review_summary = os.environ.get("REVIEW_SUMMARY", "")
          review_issues = os.environ.get("REVIEW_ISSUES", "")

          if merged:
              color = 0x2ECC71  # green
              title = "Approved & Merged to Deploy"
              desc = f"Opus 4.6 approved. Merged to deploy branch — Railway will auto-deploy.\n\n**Review:** {review_summary}"
          elif not lint_ok:
              color = 0xE74C3C  # red
              title = "BLOCKED — Lint Failed"
              desc = "Consistency linter found errors. Push is NOT deployed.\nCheck the [Action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          elif not review_ok:
              color = 0xE74C3C  # red
              title = "BLOCKED — AI Review Rejected"
              desc = f"Opus 4.6 found issues. Push is NOT deployed.\n\n**Review:** {review_summary}"
              if review_issues:
                  desc += f"\n\n**Issues:**\n{review_issues}"
          else:
              color = 0xF1C40F  # yellow
              title = "Review Passed but Merge Failed"
              desc = "AI approved but the merge step failed. Check the Action logs."

          embed = {
              "title": title,
              "description": desc[:4096],
              "color": color,
              "fields": [
                  {"name": "Commit", "value": f"`{os.environ.get('SHA', '?')}`", "inline": True},
                  {"name": "Author", "value": os.environ.get("AUTHOR", "?"), "inline": True},
              ],
          }
          resp = httpx.post(webhook, json={"embeds": [embed]})
          print(f"Discord: {resp.status_code}")
          PYEOF
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          MERGED: ${{ steps.merge.outputs.merged }}
          REVIEW_SUMMARY: ${{ steps.review.outputs.summary }}
          REVIEW_ISSUES: ${{ steps.review.outputs.issues }}
          SHA: ${{ steps.meta.outputs.sha_short }}
          AUTHOR: ${{ steps.meta.outputs.author }}
